# ==============================================================
# GitLab CI/CD Pipeline for CIMS Microservices
# ==============================================================

stages:
  - build
  - test
  - security
  - deploy

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  KUBE_NAMESPACE: cims

# ---------------------------------------------------------------
# BUILD STAGE - Build Docker images for all services
# ---------------------------------------------------------------
build:auth-service:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_PREFIX/auth-service:$IMAGE_TAG ./auth-service
    - docker push $IMAGE_PREFIX/auth-service:$IMAGE_TAG
    - docker tag $IMAGE_PREFIX/auth-service:$IMAGE_TAG $IMAGE_PREFIX/auth-service:latest
    - docker push $IMAGE_PREFIX/auth-service:latest
  only:
    - main
    - develop
    - /^003-/

build:patient-service:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_PREFIX/patient-service:$IMAGE_TAG ./patient-service
    - docker push $IMAGE_PREFIX/patient-service:$IMAGE_TAG
    - docker tag $IMAGE_PREFIX/patient-service:$IMAGE_TAG $IMAGE_PREFIX/patient-service:latest
    - docker push $IMAGE_PREFIX/patient-service:latest
  only:
    - main
    - develop
    - /^003-/

build:rdv-service:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_PREFIX/rdv-service:$IMAGE_TAG ./rdv-service
    - docker push $IMAGE_PREFIX/rdv-service:$IMAGE_TAG
    - docker tag $IMAGE_PREFIX/rdv-service:$IMAGE_TAG $IMAGE_PREFIX/rdv-service:latest
    - docker push $IMAGE_PREFIX/rdv-service:latest
  only:
    - main
    - develop
    - /^003-/

build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_PREFIX/frontend:$IMAGE_TAG ./frontend
    - docker push $IMAGE_PREFIX/frontend:$IMAGE_TAG
    - docker tag $IMAGE_PREFIX/frontend:$IMAGE_TAG $IMAGE_PREFIX/frontend:latest
    - docker push $IMAGE_PREFIX/frontend:latest
  only:
    - main
    - develop
    - /^003-/

# ---------------------------------------------------------------
# TEST STAGE - Run tests for services
# ---------------------------------------------------------------
test:auth-service:
  stage: test
  image: node:18-alpine
  script:
    - cd auth-service
    - npm install
    - npm test || echo "No tests defined"
  only:
    - main
    - develop

test:patient-service:
  stage: test
  image: node:18-alpine
  script:
    - cd patient-service
    - npm install
    - npm test || echo "No tests defined"
  only:
    - main
    - develop

test:rdv-service:
  stage: test
  image: python:3.11-slim
  script:
    - cd rdv-service
    - pip install -r requirements.txt
    - python -m pytest || echo "No tests defined"
  only:
    - main
    - develop

test:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  only:
    - main
    - develop

# ---------------------------------------------------------------
# SECURITY STAGE - SAST scanning with Semgrep
# ---------------------------------------------------------------
semgrep:
  image: semgrep/semgrep
  script:
    - semgrep ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"  # allow triggering a scan manually from the gitlab UI
    - if: $CI_MERGE_REQUEST_IID  # scan on merge request events
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # scan on push events to default branch
    - if: $CI_COMMIT_BRANCH =~ /^003-/  # scan on feature branches for testing
  variables:
    SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN
  # To configure MR comments on gitlab.com, see https://semgrep.dev/docs/semgrep-cloud-platform/gitlab-mr-comments/#steps-to-set-up-mr-comments
  # GITLAB_TOKEN: $PAT add this in gitlabci

# ---------------------------------------------------------------
# DEPLOY STAGE - Deploy to Minikube/Kubernetes
# ---------------------------------------------------------------
deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - kubectl config use-context minikube
  script:
    - echo "Deploying to production..."
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/secrets.yaml
    - kubectl apply -f k8s/postgres-init-configmap.yaml
    - kubectl apply -f k8s/mysql-init-configmap.yaml
    - sed -i "s|image:.*auth-service:latest|image: $IMAGE_PREFIX/auth-service:$IMAGE_TAG|g" k8s/auth-deployment.yaml
    - sed -i "s|image:.*patient-service:latest|image: $IMAGE_PREFIX/patient-service:$IMAGE_TAG|g" k8s/patient-deployment.yaml
    - sed -i "s|image:.*rdv-service:latest|image: $IMAGE_PREFIX/rdv-service:$IMAGE_TAG|g" k8s/rdv-deployment.yaml
    - sed -i "s|image:.*frontend:latest|image: $IMAGE_PREFIX/frontend:$IMAGE_TAG|g" k8s/frontend-deployment.yaml
    - kubectl apply -f k8s/postgres-deployment.yaml
    - kubectl apply -f k8s/mongodb-deployment.yaml
    - kubectl apply -f k8s/mysql-deployment.yaml
    - kubectl apply -f k8s/auth-deployment.yaml
    - kubectl apply -f k8s/patient-deployment.yaml
    - kubectl apply -f k8s/rdv-deployment.yaml
    - kubectl apply -f k8s/frontend-deployment.yaml
    - kubectl rollout status deployment/postgres -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/mongodb -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/mysql -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/auth-service -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/patient-service -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/rdv-service -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/frontend -n $KUBE_NAMESPACE --timeout=300s
    - echo "Deployment completed successfully!"
  only:
    - main
  when: manual
  environment:
    name: production
    url: http://cims.local

deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - kubectl config use-context minikube
  script:
    - echo "Deploying to staging..."
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/secrets.yaml
    - kubectl apply -f k8s/postgres-init-configmap.yaml
    - kubectl apply -f k8s/mysql-init-configmap.yaml
    - sed -i "s|image:.*auth-service:latest|image: $IMAGE_PREFIX/auth-service:$IMAGE_TAG|g" k8s/auth-deployment.yaml
    - sed -i "s|image:.*patient-service:latest|image: $IMAGE_PREFIX/patient-service:$IMAGE_TAG|g" k8s/patient-deployment.yaml
    - sed -i "s|image:.*rdv-service:latest|image: $IMAGE_PREFIX/rdv-service:$IMAGE_TAG|g" k8s/rdv-deployment.yaml
    - sed -i "s|image:.*frontend:latest|image: $IMAGE_PREFIX/frontend:$IMAGE_TAG|g" k8s/frontend-deployment.yaml
    - kubectl apply -f k8s/postgres-deployment.yaml
    - kubectl apply -f k8s/mongodb-deployment.yaml
    - kubectl apply -f k8s/mysql-deployment.yaml
    - kubectl apply -f k8s/auth-deployment.yaml
    - kubectl apply -f k8s/patient-deployment.yaml
    - kubectl apply -f k8s/rdv-deployment.yaml
    - kubectl apply -f k8s/frontend-deployment.yaml
    - kubectl rollout status deployment/postgres -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/mongodb -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/mysql -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/auth-service -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/patient-service -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/rdv-service -n $KUBE_NAMESPACE --timeout=300s
    - kubectl rollout status deployment/frontend -n $KUBE_NAMESPACE --timeout=300s
    - echo "Staging deployment completed!"
  only:
    - develop
  environment:
    name: staging
    url: http://cims-staging.local
