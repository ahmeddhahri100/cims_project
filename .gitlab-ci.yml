stages:
  - build
  - test
  - security
  - deploy

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ------------------------------------------------
# DOCKER LOGIN TEMPLATE
# ------------------------------------------------
.docker-login:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ------------------------------------------------
# BUILD STAGE
# ------------------------------------------------
build:auth:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/auth-service:$IMAGE_TAG ./auth-service
    - docker push $IMAGE_PREFIX/auth-service:$IMAGE_TAG

build:patient:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/patient-service:$IMAGE_TAG ./patient-service
    - docker push $IMAGE_PREFIX/patient-service:$IMAGE_TAG

build:rdv:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/rdv-service:$IMAGE_TAG ./rdv-service
    - docker push $IMAGE_PREFIX/rdv-service:$IMAGE_TAG

build:frontend:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/frontend:$IMAGE_TAG ./frontend
    - docker push $IMAGE_PREFIX/frontend:$IMAGE_TAG

# ------------------------------------------------
# TEST STAGE
# ------------------------------------------------
test:auth:
  stage: test
  image: node:18
  script:
    - cd auth-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    coverage:
      cobertura: coverage/cobertura-coverage.xml
    paths:
      - coverage/
  only:
    - main
    - develop
    - /^003-/

test:patient:
  stage: test
  image: node:18
  script:
    - cd patient-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    coverage:
      cobertura: coverage/cobertura-coverage.xml
    paths:
      - coverage/
  only:
    - main
    - develop
    - /^003-/

test:rdv:
  stage: test
  image: python:3.11
  script:
    - cd rdv-service
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest --cov=./ --cov-report=xml --cov-report=html
  artifacts:
    reports:
      junit: junit.xml
    coverage:
      cobertura: coverage.xml
    paths:
      - htmlcov/
  only:
    - main
    - develop
    - /^003-/

test:frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
  only:
    - main
    - develop
    - /^003-/

# ------------------------------------------------
# SAST SECURITY (SEMGRP)
# ------------------------------------------------
semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep --config=.semgrep.yml --fail-on=ERROR --sarif-output=semgrep.sarif .
  artifacts:
    reports:
      sast: semgrep.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"  # allow triggering a scan manually from the gitlab UI
    - if: $CI_MERGE_REQUEST_IID  # scan on merge request events
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # scan on push events to default branch
    - if: $CI_COMMIT_BRANCH =~ /^003-/  # scan on feature branches for testing
  variables:
    SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN

# ------------------------------------------------
# DEPLOY STAGE (FAKE DEPLOYMENT TEST)
# ------------------------------------------------
deploy:test:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Starting fake deployment test..."
    - echo "Checking built images:"
    - echo "  AUTH-SERVICE: $IMAGE_PREFIX/auth-service:$IMAGE_TAG"
    - echo "  PATIENT-SERVICE: $IMAGE_PREFIX/patient-service:$IMAGE_TAG"
    - echo "  RDV-SERVICE: $IMAGE_PREFIX/rdv-service:$IMAGE_TAG"
    - echo "  FRONTEND: $IMAGE_PREFIX/frontend:$IMAGE_TAG"
    - echo ""
    - echo "Validating image tags..."
    - if [ -z "$IMAGE_TAG" ]; then echo "ERROR: IMAGE_TAG is empty"; exit 1; fi
    - echo "  ✓ IMAGE_TAG is set: $IMAGE_TAG"
    - echo ""
    - echo "Simulating Kubernetes deployment steps..."
    - echo "  ✓ Creating namespace: cims"
    - echo "  ✓ Applying configmaps"
    - echo "  ✓ Applying secrets"
    - echo "  ✓ Deploying auth-service"
    - echo "  ✓ Deploying patient-service"
    - echo "  ✓ Deploying rdv-service"
    - echo "  ✓ Deploying frontend"
    - echo ""
    - echo "Simulating rollout status checks..."
    - echo "  ✓ All deployments rolled out successfully"
    - echo ""
    - echo "Fake deployment completed successfully!"
  environment:
    name: test
  only:
    - main
    - develop
    - /^003-/