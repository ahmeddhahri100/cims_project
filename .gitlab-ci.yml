stages:
  - build
  - test
  - security
  - deploy

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ------------------------------------------------
# DOCKER LOGIN TEMPLATE
# ------------------------------------------------
.docker-login:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ------------------------------------------------
# BUILD STAGE
# ------------------------------------------------
build:auth:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/auth-service:$IMAGE_TAG ./auth-service
    - docker push $IMAGE_PREFIX/auth-service:$IMAGE_TAG

build:patient:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/patient-service:$IMAGE_TAG ./patient-service
    - docker push $IMAGE_PREFIX/patient-service:$IMAGE_TAG

build:rdv:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/rdv-service:$IMAGE_TAG ./rdv-service
    - docker push $IMAGE_PREFIX/rdv-service:$IMAGE_TAG

build:frontend:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/frontend:$IMAGE_TAG ./frontend
    - docker push $IMAGE_PREFIX/frontend:$IMAGE_TAG

# ------------------------------------------------
# TEST STAGE
# ------------------------------------------------
test:auth:
  stage: test
  image: node:18
  script:
    - cd auth-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
  coverage: '/All files\s+\|.*\s+([\d.]+)%/'
  only:
    - main
    - develop
    - /^003-/

test:patient:
  stage: test
  image: node:18
  script:
    - cd patient-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
  coverage: '/All files\s+\|.*\s+([\d.]+)%/'
  only:
    - main
    - develop
    - /^003-/

test:rdv:
  stage: test
  image: python:3.11
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: cims_rdv
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: devpassword
  script:
    - cd rdv-service
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest --cov=./ --cov-report=xml --cov-report=html
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL\s+\|.*\s+([\d]+%)/'
  only:
    - main
    - develop
    - /^003-/

test:frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
  only:
    - main
    - develop
    - /^003-/

# ------------------------------------------------
# SAST SECURITY (SEMGREP)
# ------------------------------------------------
semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - export SEMGREP_APP_TOKEN="${SEMGREP_APP_TOKEN}"
    - semgrep --config=.semgrep.yml --sarif-output=semgrep.sarif .
    - semgrep push 
  artifacts:
    reports:
      sast: semgrep.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"  # allow triggering a scan manually from the gitlab UI
    - if: $CI_MERGE_REQUEST_IID  # scan on merge request events
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # scan on push events to default branch
    - if: $CI_COMMIT_BRANCH =~ /^003-/  # scan on feature branches for testing
  variables:
    SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN

# ------------------------------------------------
# DEPLOY STAGE (TEST ONLY)
# ------------------------------------------------
deploy:test:
  stage: deploy
  script:
    - echo "Pipeline completed successfully"
    - echo "Deployment will be added later with Kubernetes"
  environment:
    name: test
    