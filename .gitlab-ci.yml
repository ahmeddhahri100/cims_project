stages:
  - build
  - test
  - trivy-fs
  - security
  - deploy

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ------------------------------------------------
# DOCKER LOGIN TEMPLATE
# ------------------------------------------------
.docker-login:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ------------------------------------------------
# BUILD STAGE
# ------------------------------------------------
build:auth:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/auth-service:$IMAGE_TAG ./auth-service
    - docker push $IMAGE_PREFIX/auth-service:$IMAGE_TAG

build:patient:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/patient-service:$IMAGE_TAG ./patient-service
    - docker push $IMAGE_PREFIX/patient-service:$IMAGE_TAG

build:rdv:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/rdv-service:$IMAGE_TAG ./rdv-service
    - docker push $IMAGE_PREFIX/rdv-service:$IMAGE_TAG

build:frontend:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/frontend:$IMAGE_TAG ./frontend
    - docker push $IMAGE_PREFIX/frontend:$IMAGE_TAG

# ------------------------------------------------
# TEST STAGE
# ------------------------------------------------
test:auth:
  stage: test
  image: node:18
  script:
    - cd auth-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
  coverage: '/All files\s+\|.*\s+([\d.]+)%/'
  only:
    - main
    - develop
    - /^003-/

test:patient:
  stage: test
  image: node:18
  script:
    - cd patient-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
  coverage: '/All files\s+\|.*\s+([\d.]+)%/'
  only:
    - main
    - develop
    - /^003-/

test:rdv:
  stage: test
  image: python:3.11
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: cims_rdv
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: devpassword
  script:
    - cd rdv-service
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest --cov=./ --cov-report=xml --cov-report=html
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL\s+\|.*\s+([\d]+%)/'
  only:
    - main
    - develop
    - /^003-/

test:frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
  only:
    - main
    - develop
    - /^003-/

# ------------------------------------------------
# TRIVY SCA (SOFTWARE COMPOSITION ANALYSIS)
# ------------------------------------------------
.trivy-sca:
  stage: trivy-fs
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress --format table ./$SERVICE_DIR
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress --format json -o trivy-$SERVICE_NAME-sca.json ./$SERVICE_DIR
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress --format template --template "@/contrib/html.tpl" -o trivy-$SERVICE_NAME-sca.html ./$SERVICE_DIR
  allow_failure: true
  artifacts:
    paths:
      - "trivy-*-sca.json"
      - "trivy-*-sca.html"
    when: always

trivy-fs:auth:
  extends: .trivy-sca
  variables:
    SERVICE_NAME: auth
    SERVICE_DIR: auth-service

trivy-fs:patient:
  extends: .trivy-sca
  variables:
    SERVICE_NAME: patient
    SERVICE_DIR: patient-service

trivy-fs:rdv:
  extends: .trivy-sca
  variables:
    SERVICE_NAME: rdv
    SERVICE_DIR: rdv-service

# ------------------------------------------------
# TRIVY CONTAINER SCANNING
# ------------------------------------------------
.trivy-scan:
  stage: security
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build --target production -t $SERVICE_NAME:$CI_COMMIT_SHORT_SHA ./$SERVICE_DIR
    - echo "Running Trivy scan in console mode..."
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress $SERVICE_NAME:$CI_COMMIT_SHORT_SHA
    - echo "Generating Trivy JSON report..."
    - trivy image --format json -o trivy-$SERVICE_NAME-report.json --severity HIGH,CRITICAL --exit-code 0 --no-progress $SERVICE_NAME:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths:
      - "trivy-*.json"
    when: always

trivy:auth:
  extends: .trivy-scan
  variables:
    SERVICE_NAME: auth
    SERVICE_DIR: auth-service

trivy:patient:
  extends: .trivy-scan
  variables:
    SERVICE_NAME: patient
    SERVICE_DIR: patient-service

trivy:rdv:
  extends: .trivy-scan
  variables:
    SERVICE_NAME: rdv
    SERVICE_DIR: rdv-service

# ------------------------------------------------
# SAST SECURITY (SEMGREP)
# ------------------------------------------------
semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep ci --sarif-output=semgrep.sarif
  artifacts:
    reports:
      sast: semgrep.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"  # allow triggering a scan manually from the gitlab UI
    - if: $CI_MERGE_REQUEST_IID  # scan on merge request events
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # scan on push events to default branch
    - if: $CI_COMMIT_BRANCH =~ /^003-/  # scan on feature branches for testing
# ------------------------------------------------
# DEPLOY STAGE (MINIKUBE / K8S)
# ------------------------------------------------
deploy:minikube:
  stage: deploy
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]
  variables:
    # Use the registry image and the commit sha for the manifests
    IMAGE_PREFIX: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  script:
    - echo "Deploying to Minikube..."
    # Check if KUBECONFIG is provided
    - if [ -z "$KUBECONFIG" ]; then echo "❌ ERROR - KUBECONFIG variable is not set" && exit 1; fi
    
    # 1. Create namespace if it doesn't exist
    - kubectl create namespace cims --dry-run=client -o yaml | kubectl apply -f -
    
    # 2. Apply ConfigMaps and Secrets first
    - envsubst < k8s/configmap.yaml | kubectl apply -f -
    - envsubst < k8s/secrets.yaml | kubectl apply -f -
    - envsubst < k8s/postgres-init-configmap.yaml | kubectl apply -f -
    - envsubst < k8s/mysql-init-configmap.yaml | kubectl apply -f -
    
    # 3. Apply Base Deployments (Databases)
    - envsubst < k8s/postgres-deployment.yaml | kubectl apply -f -
    - envsubst < k8s/mysql-deployment.yaml | kubectl apply -f -
    - envsubst < k8s/mongodb-deployment.yaml | kubectl apply -f -
    
    # 4. Apply Microservices
    - envsubst < k8s/auth-deployment.yaml | kubectl apply -f -
    - envsubst < k8s/patient-deployment.yaml | kubectl apply -f -
    - envsubst < k8s/rdv-deployment.yaml | kubectl apply -f -
    - envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
    
    # 5. Verify Rollout
    - kubectl rollout status deployment/auth-service -n cims --timeout=120s
    - echo "✅ Deployment to Minikube successful!"
  environment:
    name: minikube
  only:
    - develop
    - main
  