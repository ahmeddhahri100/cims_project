stages:
  - build
  - test
  - trivy-fs
  - security
  - deploy

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ------------------------------------------------
# DOCKER LOGIN TEMPLATE
# ------------------------------------------------
.docker-login:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ------------------------------------------------
# BUILD STAGE
# ------------------------------------------------
build:auth:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/auth-service:$IMAGE_TAG ./auth-service
    - docker push $IMAGE_PREFIX/auth-service:$IMAGE_TAG

build:patient:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/patient-service:$IMAGE_TAG ./patient-service
    - docker push $IMAGE_PREFIX/patient-service:$IMAGE_TAG

build:rdv:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/rdv-service:$IMAGE_TAG ./rdv-service
    - docker push $IMAGE_PREFIX/rdv-service:$IMAGE_TAG

build:frontend:
  stage: build
  extends: .docker-login
  script:
    - docker build --target production -t $IMAGE_PREFIX/frontend:$IMAGE_TAG ./frontend
    - docker push $IMAGE_PREFIX/frontend:$IMAGE_TAG

# ------------------------------------------------
# TEST STAGE
# ------------------------------------------------
test:auth:
  stage: test
  image: node:18
  script:
    - cd auth-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
  coverage: '/All files\s+\|.*\s+([\d.]+)%/'
  only:
    - main
    - develop
    - /^003-/

test:patient:
  stage: test
  image: node:18
  script:
    - cd patient-service
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
  coverage: '/All files\s+\|.*\s+([\d.]+)%/'
  only:
    - main
    - develop
    - /^003-/

test:rdv:
  stage: test
  image: python:3.11
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: cims_rdv
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: devpassword
    DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/cims_rdv"
  script:
    - cd rdv-service
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest --cov=./ --cov-report=xml --cov-report=html
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL\s+\|.*\s+([\d]+%)/'
  only:
    - main
    - develop
    - /^003-/

test:frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
  only:
    - main
    - develop
    - /^003-/

# ------------------------------------------------
# TRIVY SCA (SOFTWARE COMPOSITION ANALYSIS)
# ------------------------------------------------
.trivy-sca:
  stage: trivy-fs
  image: 
    name: ghcr.io/aquasecurity/trivy:0.49.1
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress --format table ./$SERVICE_DIR
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress --format json -o trivy-$SERVICE_NAME-sca.json ./$SERVICE_DIR
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress --format template --template "@/contrib/html.tpl" -o trivy-$SERVICE_NAME-sca.html ./$SERVICE_DIR
  allow_failure: true
  artifacts:
    paths:
      - "trivy-*-sca.json"
      - "trivy-*-sca.html"
    when: always

trivy-fs:auth:
  extends: .trivy-sca
  variables:
    SERVICE_NAME: auth
    SERVICE_DIR: auth-service

trivy-fs:patient:
  extends: .trivy-sca
  variables:
    SERVICE_NAME: patient
    SERVICE_DIR: patient-service

trivy-fs:rdv:
  extends: .trivy-sca
  variables:
    SERVICE_NAME: rdv
    SERVICE_DIR: rdv-service

# ------------------------------------------------
# TRIVY CONTAINER SCANNING
# ------------------------------------------------
.trivy-scan:
  stage: security
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build --target production -t $SERVICE_NAME:$CI_COMMIT_SHORT_SHA ./$SERVICE_DIR
    - echo "Running Trivy scan in console mode..."
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress $SERVICE_NAME:$CI_COMMIT_SHORT_SHA
    - echo "Generating Trivy JSON report..."
    - trivy image --format json -o trivy-$SERVICE_NAME-report.json --severity HIGH,CRITICAL --exit-code 0 --no-progress $SERVICE_NAME:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths:
      - "trivy-*.json"
    when: always

trivy:auth:
  extends: .trivy-scan
  variables:
    SERVICE_NAME: auth
    SERVICE_DIR: auth-service

trivy:patient:
  extends: .trivy-scan
  variables:
    SERVICE_NAME: patient
    SERVICE_DIR: patient-service

trivy:rdv:
  extends: .trivy-scan
  variables:
    SERVICE_NAME: rdv
    SERVICE_DIR: rdv-service

# ------------------------------------------------
# SAST SECURITY (SEMGREP + OWASP ZAP)
# ------------------------------------------------
semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep ci --sarif-output=semgrep.sarif
  artifacts:
    reports:
      sast: semgrep.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^003-/

# OWASP ZAP Baseline Scan - runs on schedule
owasp:baseline:
  stage: security
  image: registry.gitlab.com/cims/microservice/zap-stable:latest
  script:
    - zap-baseline.py -t $ZAP_TARGET_URL -J zap-baseline.json -r zap-baseline-report.html
  artifacts:
    reports:
      sast: zap-baseline.json
    paths:
      - zap-baseline-report.html
  variables:
    ZAP_TARGET_URL: "http://192.168.49.2:30080"
  only:
    - schedules

# ------------------------------------------------
# DEPLOY STAGE — Update k8s manifests & push to trigger ArgoCD
# ------------------------------------------------
deploy:minikube:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@cims.local"
    - git config user.name "CIMS CI Pipeline"
  script:
    - |
      for f in k8s/*-deployment.yaml; do
        service=$(basename "$f" | sed 's/-deployment.yaml//')
        sed -i "s|image: registry.gitlab.com/cims/microservice/${service}:.*|image: registry.gitlab.com/cims/microservice/${service}:${CI_COMMIT_SHORT_SHA}|" "$f"
      done
    - |
      if ! git diff --cached --exit-code; then
        echo "Changes detected, committing..."
        git add k8s/*-deployment.yaml
        git commit -m "Update image tags to $CI_COMMIT_SHORT_SHA [skip ci]"
        git push https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:${CI_COMMIT_REF_NAME}
      else
        echo "No changes to commit"
        exit 0
      fi
  only:
    - main
  needs:
    - build:auth
    - build:patient
    - build:rdv
    - build:frontend
    - test:auth
    - test:patient
    - test:rdv
    - test:frontend
    