services:
  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: cims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - cims-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────────

  auth-service:
    build:
      context: ./auth-service
    container_name: cims-auth
    restart: unless-stopped
    env_file: ./auth-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@postgres:5432/cims_auth
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cims-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3001/health'', r => process.exit(r.statusCode===200?0:1))"',
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  patient-service:
    build:
      context: ./patient-service
    container_name: cims-patient
    restart: unless-stopped
    env_file: ./patient-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@postgres:5432/cims_patients
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3005:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - cims-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3002/health'', r => process.exit(r.statusCode===200?0:1))"',
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  rdv-service:
    build:
      context: ./rdv-service
    container_name: cims-rdv
    restart: unless-stopped
    env_file: ./rdv-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@postgres:5432/cims_rdv
      AUTH_SERVICE_URL: http://auth-service:3001
      PATIENT_SERVICE_URL: http://patient-service:3002
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - cims-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:3003/health'')"',
        ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
    container_name: cims-frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      - auth-service
      - patient-service
      - rdv-service
    networks:
      - cims-net

# ─────────────────────────────────────────────
volumes:
  postgres_data:

networks:
  cims-net:
    driver: bridge
