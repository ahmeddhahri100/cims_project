services:
  postgres:
    image: postgres:16
    restart: always
    mem_limit: 256m
    mem_reservation: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8npassword
      - POSTGRES_DB=n8n
      - POSTGRES_NON_ROOT_USER=n8n
      - POSTGRES_NON_ROOT_PASSWORD=n8npassword
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voc-net

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: platform-voc-n8n
    restart: always
    mem_limit: 1g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.ollama:172.17.0.1"
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_SCHEMA=n8n
      - DB_POSTGRESDB_PASSWORD=n8npassword
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voc-net

  ollama:
    image: ollama/ollama:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - voc-net
    extra_hosts:
      - "host.containers.internal:host-gateway"
    devices:
      - nvidia.com/gpu=all



  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: voc-keycloak
    command: start-dev --import-realm
    mem_limit: 768m
    mem_reservation: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    environment:
      JAVA_OPTS: -Xms256m -Xmx512m -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=128m
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: devpassword
      KC_DB: postgres
      KC_DB_SCHEMA: keycloak
      KC_DB_URL: jdbc:postgresql://postgres:5432/n8n
      KC_DB_USERNAME: n8n
      KC_DB_PASSWORD: n8npassword
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voc-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    restart: always
    mem_limit: 3g
    mem_reservation: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - voc-net

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.25
    restart: always
    mem_limit: 768m
    mem_reservation: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5601:5601"
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=CHANGE_ME
    depends_on:
      elasticsearch:
        condition: service_started
    networks:
      - voc-net

volumes:
  db_data:
  n8n_data:
  ollama_data:
  elasticsearch_data:

networks:
  voc-net:
    driver: bridge
