# Auth Service Deployment for CIMS

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cims
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - name: auth-service
        image: registry.gitlab.com/cims/microservice/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: cims-config
              key: AUTH_SERVICE_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cims-secrets
              key: JWT_SECRET
        - name: RDV_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: cims-config
              key: RDV_SERVICE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cims-secrets
              key: AUTH_DATABASE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cims
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  selector:
    app: auth-service
