# Kubernetes Secrets for CIMS Microservices

apiVersion: v1
kind: Secret
metadata:
  name: cims-secrets
  namespace: cims
  labels:
    app: cims-microservices
type: Opaque
stringData:
  # PostgreSQL Password
  POSTGRES_PASSWORD: "devpassword"
  
  # JWT Secret Key (CHANGE THIS IN PRODUCTION!)
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  
  # Database URLs with credentials
  AUTH_DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/cims_auth"
  PATIENTS_DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/cims_patients"
  RDV_DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/cims_rdv"
