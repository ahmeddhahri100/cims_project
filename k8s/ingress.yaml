# Ingress configuration for CIMS
# ═══════════════════════════════════════════════════════════════

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cims-ingress
  namespace: cims
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Optional: SSL configuration if certificates are available
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: cims.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      - path: /api/patients
        pathType: Prefix
        backend:
          service:
            name: patient-service
            port:
              number: 3002
      - path: /api/rdv
        pathType: Prefix
        backend:
          service:
            name: rdv-service
            port:
              number: 3003
