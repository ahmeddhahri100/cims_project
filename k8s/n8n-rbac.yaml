apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-scanner
  namespace: cims
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-scanner-token
  namespace: cims
  annotations:
    kubernetes.io/service-account.name: n8n-scanner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: n8n-scanner-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n8n-scanner-rolebinding
subjects:
- kind: ServiceAccount
  name: n8n-scanner
  namespace: cims
roleRef:
  kind: ClusterRole
  name: n8n-scanner-role
  apiGroup: rbac.authorization.k8s.io
