# ═══════════════════════════════════════════════════════════════
# Kubernetes ConfigMap for CIMS Microservices
# ═══════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: cims-config
  namespace: cims
  labels:
    app: cims-microservices
data:
  # Database Hosts
  POSTGRES_HOST: "postgres"
  MONGODB_HOST: "mongodb-service"
  MYSQL_HOST: "mysql-service"
  POSTGRES_PORT: "5432"
  MONGODB_PORT: "27017"
  MYSQL_PORT: "3306"
  POSTGRES_USER: "postgres"

  # Database Names
  AUTH_DB_NAME: "cims_auth"
  PATIENTS_DB_NAME: "cims_patients"
  RDV_DB_NAME: "cims_rdv"

  # Service URLs (Internal Kubernetes DNS)
  AUTH_SERVICE_URL: "http://auth-service:3001"
  PATIENT_SERVICE_URL: "http://patient-service:3002"
  RDV_SERVICE_URL: "http://rdv-service:3003"

  # Service Ports
  AUTH_SERVICE_PORT: "3001"
  PATIENT_SERVICE_PORT: "3002"
  RDV_SERVICE_PORT: "3003"
  FRONTEND_PORT: "80"

  # JWT Configuration
  JWT_EXPIRES_IN: "24h"

  # Environment
  NODE_ENV: "production"
  PYTHON_ENV: "production"
