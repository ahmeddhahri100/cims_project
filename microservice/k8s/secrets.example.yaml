# Kubernetes Secrets for CIMS Microservices
# TEMPLATE ONLY - copy to secrets.yaml and fill in real values.
#   cp secrets.example.yaml secrets.yaml
# secrets.yaml is gitignored and must never be committed.

apiVersion: v1
kind: Secret
metadata:
  name: cims-secrets
  namespace: cims
  labels:
    app: cims-microservices
type: Opaque
stringData:
  # PostgreSQL Password
  POSTGRES_PASSWORD: "CHANGE_ME"

  # JWT Secret Key (generate with: openssl rand -base64 48)
  JWT_SECRET: "CHANGE_ME"

  # Database URLs with credentials
  AUTH_DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres:5432/cims_auth"
  PATIENTS_DATABASE_URL: "mongodb://admin:CHANGE_ME@mongodb-service:27017/cims_patients?authSource=admin"
  RDV_DATABASE_URL: "mysql+pymysql://root:CHANGE_ME@mysql-service:3306/cims_rdv"