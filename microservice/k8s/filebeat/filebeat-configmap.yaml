apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: cims
  labels:
    app: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: /var/log/containers/

    output.elasticsearch:
      hosts: ['${ELASTICSEARCH_HOST:host.minikube.internal}:${ELASTICSEARCH_PORT:9200}']
      username: "elastic"
      password: "CHANGE_ME"
      index: "filebeat-cims-%{+yyyy.MM.dd}"

    setup.template.name: "filebeat-cims"
    setup.template.pattern: "filebeat-cims-*"


